aid: onxmaps
name: OnXMaps
description: 'onX Maps (onXmaps) is a Montana-based GPS mapping technology company building
  offline-capable navigation apps for outdoor recreation. Its product line spans onX Hunt
  (hunting maps with public/private land boundaries, species and unit data), onX Offroad
  (650K+ miles of off-road and overland trails), onX Backcountry (hiking, backpacking,
  skiing and climbing, incorporating Mountain Project and MTB Project data), and onX Fish
  (lake maps and fishing). The company is backed by Bessemer Venture Partners. onX does
  not publish a public developer API; this profile is a company record enriched from its
  public web, security, and trust surfaces rather than an API contract.'
